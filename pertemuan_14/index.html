<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Laporan PDF</title>
    <style>
        .img-container {
            text-align: left;
            margin-bottom: 40px;
        }

        .img-container img {
            width: 67%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="pdf-report">
        <h1>Membuat Laporan PDF</h1>

        <div class="img-container" style="margin-left: 20px;">
            <p>User dapat memfilter log yang akan dimasukkan ke dalam PDF</p>

            <img src="assets/pdf page.jpg" alt="pdf-page">
        </div>

        <div class="img-container" style="margin-left: 20px;">
            <p>User dapat melihat preview pdf sebelum ke halaman print</p>

            <img src="assets/pdf preview.jpg" alt="pdf-preview">
        </div>

        <div style="margin-left: 20px;">
            <p>Hasil PDF</p>
            <embed src="assets/AQW Pathfinder Panel.pdf" type="application/pdf" width="67%" height="600px" />
        </div>
    </div>
</body>
</html>
